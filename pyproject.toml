[project]
name = "fraud-investigator"
version = "0.1.0"
description = "Real-time agentic payment fraud investigation: Kafka -> anomaly detection -> LangGraph multi-agent -> human review"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # LLM + agents
    "langchain>=1.0",
    "langchain-anthropic>=1.0",
    "langgraph>=1.0",
    "langgraph-checkpoint-postgres>=2.0",
    "langchain-postgres>=0.0.15",
    "fastembed>=0.4",
    "anthropic>=0.70",
    "mcp>=1.10",
    # data plane
    "confluent-kafka>=2.6",
    "psycopg[binary,pool]>=3.2",
    "neo4j>=5.24",
    "redis>=5.0",
    # ML
    "scikit-learn>=1.5",
    "numpy>=1.26",
    "pandas>=2.2",
    "joblib>=1.4",
    # app
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "streamlit>=1.39",
    "httpx>=0.27",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "faker>=30.0",
    "rich>=13.0",
    "langchain-text-splitters>=1.1.3",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fraud_agent"]

[tool.ruff]
line-length = 100
